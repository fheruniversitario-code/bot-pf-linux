<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces Oficiales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-full bg-gradient-to-b from-slate-900 via-slate-950 to-slate-950 text-slate-100 flex flex-col items-center justify-start p-6 font-sans">
    
    <div class="w-full max-w-sm flex flex-col items-center my-auto space-y-6">
        <!-- Logo / Avatar con Soporte de Imagen o Icono IA -->
        <div id="contenedor-logo-linktree" class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 p-1 shadow-2xl shadow-indigo-500/30 transform hover:scale-105 transition duration-300 overflow-hidden flex items-center justify-center">
            <div id="subcontenedor-logo" class="w-full h-full bg-slate-900 rounded-[22px] flex items-center justify-center overflow-hidden">
                <svg id="svg-logo-default" class="w-12 h-12 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                    <circle cx="12" cy="12" r="4" fill="currentColor" class="opacity-30"/>
                    <path d="m12 9 1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2z" fill="currentColor"/>
                </svg>
            </div>
        </div>

        <!-- Titulo y Bio -->
        <div class="text-center space-y-1.5">
            <h1 id="linktree-titulo" class="text-2xl font-bold text-white tracking-tight">Mi Empresa Oficial</h1>
            <p id="linktree-descripcion" class="text-xs text-slate-400 max-w-xs leading-relaxed">Atención personalizada y servicios profesionales 24/7</p>
        </div>

        <!-- Contenedor Dinámico de Enlaces -->
        <div id="enlaces-container" class="w-full space-y-3.5 pt-2">
            <!-- Cargando Skeleton -->
            <div class="w-full py-4 bg-slate-800/60 rounded-2xl animate-pulse"></div>
            <div class="w-full py-4 bg-slate-800/60 rounded-2xl animate-pulse"></div>
        </div>

        <!-- Footer con Acceso al Panel -->
        <div class="pt-8 text-center space-y-2">
            <a href="/login.html" class="inline-flex items-center space-x-1.5 px-3 py-1 bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-white rounded-full text-[11px] transition">
                <i class="fa-solid fa-lock text-[10px]"></i>
                <span>Acceder al Panel de Control</span>
            </a>
            <div class="text-[10px] text-slate-600 font-medium">
                ⚡ Powered by <span class="text-slate-400 font-semibold">OmniBot AI Agent</span>
            </div>
        </div>
    </div>

    <script>
        async function cargarEnlaces() {
            try {
                const res = await fetch('/api/linktree');
                const data = await res.json();

                if (data.titulo) document.getElementById('linktree-titulo').textContent = data.titulo;
                if (data.descripcion) document.getElementById('linktree-descripcion').textContent = data.descripcion;

                if (data.logo_url && data.logo_url.trim()) {
                    document.getElementById('subcontenedor-logo').innerHTML = `<img src="${data.logo_url}" alt="Logo" class="w-full h-full object-cover">`;
                }

                const cont = document.getElementById('enlaces-container');
                cont.innerHTML = '';

                (data.links || []).forEach(l => {
                    const btn = document.createElement('a');
                    btn.href = l.url;
                    btn.target = '_blank';

                    let iconoClass = 'fa-solid fa-arrow-up-right-from-square';
                    let estiloExtra = 'bg-slate-900/90 border-slate-800 hover:border-slate-700 text-slate-200';

                    if (l.icono === 'whatsapp' || l.url.includes('wa.me')) {
                        iconoClass = 'fa-brands fa-whatsapp';
                        estiloExtra = 'bg-emerald-600 hover:bg-emerald-500 text-white font-semibold shadow-lg shadow-emerald-600/30';
                    } else if (l.icono === 'catalog') {
                        iconoClass = 'fa-solid fa-bag-shopping';
                        estiloExtra = 'bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow-lg shadow-indigo-600/30';
                    } else if (l.icono === 'facebook') {
                        iconoClass = 'fa-brands fa-facebook';
                    } else if (l.icono === 'instagram') {
                        iconoClass = 'fa-brands fa-instagram';
                    } else if (l.icono === 'tiktok') {
                        iconoClass = 'fa-brands fa-tiktok';
                    }

                    btn.className = `w-full py-3.5 px-5 border rounded-2xl flex items-center justify-between text-sm transition duration-200 transform hover:-translate-y-0.5 ${estiloExtra}`;
                    btn.innerHTML = `
                        <span class="flex items-center space-x-3">
                            <i class="${iconoClass} text-lg w-5 text-center"></i>
                            <span>${l.titulo}</span>
                        </span>
                        <i class="fa-solid fa-chevron-right text-xs opacity-60"></i>
                    `;
                    cont.appendChild(btn);
                });
            } catch (e) {
                console.error("Error cargando links:", e);
            }
        }
        cargarEnlaces();
    </script>
</body>
</html>
